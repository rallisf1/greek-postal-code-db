[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greek-postal-code-db"
version = "0.1.0"
description = "Read-only Greek postal-code data backed by an embedded SQLite database"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Greek Postal Code DB contributors" }]
keywords = ["greece", "greek", "postcode", "postal-code", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/rallisf1/greek-postal-code-db"
Issues = "https://github.com/rallisf1/greek-postal-code-db/issues"
Source = "https://github.com/rallisf1/greek-postal-code-db/tree/main/python"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
greek_postal_code_db = ["data/library.sqlite"]
